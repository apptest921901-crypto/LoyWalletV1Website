<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentification | LoyWallet</title>
  <style>
    :root {
      --primary: #0066ff;
      --bg: #f4f7f9;
      --text: #1A1A1A;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      max-width: 420px;
      width: 90%;
      background: #fff;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
      position: relative;
      overflow: hidden;
    }

    .logo {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 1.5rem;
      letter-spacing: -1px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    p {
      line-height: 1.6;
      color: #666;
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-block;
      padding: 1rem 2rem;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      font-size: 1.1rem;
      box-shadow: 0 4px 12px rgba(0, 102, 255, 0.2);
    }

    .btn:hover {
      background: #0052cc;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0, 102, 255, 0.3);
    }

    .spinner-container {
      margin: 2rem 0;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .testing-panel {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #eee;
      display: none;
      text-align: left;
    }

    .testing-panel h3 {
      font-size: 0.9rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 1rem;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 1rem;
    }

    input {
      flex: 1;
      padding: 0.8rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .small-btn {
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      background: #eee;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .small-btn.active {
      background: var(--primary);
      color: white;
    }

    .error-box {
      background: #fff1f0;
      border: 1px solid #ffa39e;
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      display: none;
    }

    .error-text {
      color: #cf1322;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .debug-info {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #999;
      background: #f8f9fa;
      padding: 1rem;
      border-radius: 10px;
      display: none;
      white-space: pre-wrap;
      max-height: 150px;
      overflow-y: auto;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">LoyWallet</div>
    
    <div id="loading-state">
      <h1 id="status-title">Presque là...</h1>
      <p id="status-msg">Nous vous redirigeons vers votre compte LoyWallet.</p>
      
      <div class="spinner-container">
        <div class="spinner"></div>
      </div>
      
      <button class="btn" id="manualBtn" onclick="redirectToApp()">Ouvrir l'application</button>
    </div>

    <div id="error-state" class="error-box">
      <p class="error-text" id="error-msg"></p>
    </div>

    <div id="testing-panel" class="testing-panel">
      <h3>Mode Test (Développeur)</h3>
      <p style="font-size: 0.8rem; margin-bottom: 0.8rem;">Si vous utilisez Expo Go, entrez l'adresse IP affichée dans votre terminal :</p>
      <div class="input-group">
        <input type="text" id="expo-ip" placeholder="Ex: 192.168.1.14" onchange="updateBase()">
        <button class="small-btn active" onclick="useExpo()">Set Expo</button>
      </div>
      <button class="small-btn" onclick="useProd()">Utiliser Production (loywalletv1://)</button>
    </div>

    <div id="debug-info" class="debug-info"></div>
  </div>

  <script>
    const qs = new URLSearchParams(window.location.search);
    const hs = new URLSearchParams(window.location.hash.slice(1));
    const params = {};
    for (const [key, value] of qs.entries()) params[key] = value;
    for (const [key, value] of hs.entries()) params[key] = value;

    const debugEl = document.getElementById('debug-info');
    const testingPanel = document.getElementById('testing-panel');
    const statusTitle = document.getElementById('status-title');
    const statusMsg = document.getElementById('status-msg');
    const errorState = document.getElementById('error-state');
    const errorMsg = document.getElementById('error-msg');
    const expoInput = document.getElementById('expo-ip');

    // 1. Detect Initial Base
    let base = params.base || params.b || params.redirectTo || localStorage.getItem('last_base');
    if (!base) {
        base = location.hostname.includes('192.168') || location.hostname === 'localhost' 
          ? 'exp://192.168.1.14:8081/--/callback' 
          : 'loywalletv1://callback';
    }

    if (base.includes('exp://')) {
      const ip = base.split('://')[1].split(':')[0];
      expoInput.value = ip;
    }

    // 2. Handle Errors
    const error = params.error || params.error_description;
    if (error) {
      statusTitle.innerText = "Authentification échouée";
      statusMsg.innerText = "Veuillez réessayer la connexion.";
      errorState.style.display = 'block';
      errorMsg.innerText = decodeURIComponent(error.replace(/\+/g, ' '));
      document.querySelector('.spinner-container').style.display = 'none';
    }

    function constructLink() {
      const tokens = {
        access_token: params.access_token || '',
        refresh_token: params.refresh_token || '',
        type: params.type || 'recovery'
      };
      
      const query = new URLSearchParams(tokens).toString();
      let link = base;
      if (query.length > 20) {
        link += (link.includes('#') ? '&' : '#') + query;
      }
      return link;
    }

    function redirectToApp() {
      const finalLink = constructLink();
      debugEl.innerText = "Redirection vers : " + finalLink;
      window.location.href = finalLink;
      
      // Fallback for some browsers
      const a = document.createElement('a');
      a.href = finalLink;
      a.click();
    }

    function updateBase() {
      const ip = expoInput.value.trim();
      if (ip) {
        base = `exp://${ip}:8081/--/callback`;
        localStorage.setItem('last_base', base);
        redirectToApp();
      }
    }

    function useExpo() { updateBase(); }
    function useProd() {
      base = 'loywalletv1://callback';
      localStorage.setItem('last_base', base);
      redirectToApp();
    }

    // 3. Auto-Redirection
    if (!error && (params.access_token || params.refresh_token)) {
      setTimeout(redirectToApp, 500);
      setTimeout(redirectToApp, 1500);
    }

    // Show debug info and panel after 4 seconds of waiting
    setTimeout(() => {
      if (!error) {
        debugEl.style.display = 'block';
        testingPanel.style.display = 'block';
      }
    }, 4000);
  </script>
</body>

</html>
