<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating | LoyWallet</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f9;
            color: #333;
            text-align: center;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007AFF;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn {
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #007AFF;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h1>Authenticating...</h1>
    <p>Please wait while we redirect you back to the app.</p>
    
    <a id="fallback-link" href="#" class="btn">Return to LoyWallet</a>

    <script>
        (function() {
            // 1. Parse current URL
            const currentUrl = new URL(window.location.href);
            const searchParams = currentUrl.searchParams;
            const hash = window.location.hash;

            // 2. Determine target app URL (passed as redirectTo param)
            const redirectTo = searchParams.get('redirectTo') || 'loywalletv1://callback';
            
            // 3. Construct the deep link
            // We use a URL-like construction but handle custom schemes carefully
            let finalUrl = redirectTo;

            // 4. Forward query parameters (errors, etc.)
            // We strip 'redirectTo' to avoid loops
            const forwardParams = new URLSearchParams();
            searchParams.forEach((value, key) => {
                if (key !== 'redirectTo') forwardParams.append(key, value);
            });
            
            const queryString = forwardParams.toString();
            if (queryString) {
                finalUrl += (finalUrl.includes('?') ? '&' : '?') + queryString;
            }

            // 5. Forward hash (access_tokens, etc.)
            if (hash) {
                finalUrl += (finalUrl.includes('#') ? '' : '#') + hash.substring(1);
            }

            // Update fallback link just in case
            const fallbackLink = document.getElementById('fallback-link');
            fallbackLink.href = finalUrl;
            
            // Show link after 3 seconds if redirect fails
            setTimeout(() => {
                fallbackLink.style.display = 'inline-block';
            }, 3000);

            // 6. Attempt redirect
            console.log("Redirecting to:", finalUrl);
            window.location.replace(finalUrl);
        })();
    </script>
</body>
</html>
