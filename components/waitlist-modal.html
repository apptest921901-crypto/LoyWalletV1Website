<!-- Waitlist Modal -->
<div id="waitlist-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4" style="background: rgba(0,0,0,0.7);">
    <div class="bg-white rounded-3xl max-w-md w-full p-8 relative shadow-2xl" onclick="event.stopPropagation()"><button onclick="closeWaitlistModal()" class="absolute top-6 right-6 text-gray-400 hover:text-gray-600 transition-colors">
        <svg width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12" />
        </svg></button>
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-purple-500 to-pink-500 rounded-2xl mb-4">
                <svg width="32" height="32" viewbox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12" />
                </svg>
            </div>
            <h3 id="waitlist-title" class="text-2xl font-bold text-gray-800 mb-2">Join the Waitlist</h3>
            <p id="waitlist-desc" class="text-gray-600">Get exclusive early access when we launch in Q1 2026</p>
        </div>
        <form id="waitlist-form" onsubmit="submitWaitlist(event)" class="space-y-4">
            <div><label for="waitlist-name" class="block text-sm font-medium text-gray-700 mb-2">Full Name</label> <input type="text" id="waitlist-name" name="name" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent" placeholder="John Doe">
            </div>
            <div><label for="waitlist-email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label> <input type="email" id="waitlist-email" name="email" required class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent" placeholder="john@example.com">
            </div><button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-3 rounded-xl font-semibold hover:opacity-90 transition-all shadow-lg"> Join Waitlist </button>
            <p class="text-xs text-gray-500 text-center">We'll notify you as soon as we launch. No spam, ever.</p>
        </form>
        <div id="success-message" class="hidden text-center py-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 rounded-full mb-4">
                <svg width="32" height="32" viewbox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path d="M20 6L9 17l-5-5" />
                </svg>
            </div>
            <h4 class="text-xl font-bold text-gray-800 mb-2">You're on the list!</h4>
            <p class="text-gray-600">We'll send you an email when we launch.</p>
        </div>
    </div>
</div>
