<!DOCTYPE html>
<html>

<head>
  <title>Authenticating...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif;">
    <p>Redirecting back to LoyWallet...</p>
  </div>
  <script>
    // 1. Get the tokens from the hash fragment (#)
    const hash = window.location.hash;

    // 2. Extract the 'redirectTo' target passed from the app
    const urlParams = new URLSearchParams(window.location.search);
    const appTarget = urlParams.get('redirectTo') || 'loywalletv1://callback';

    // 3. Reconstruct the deep link - Only append hash if it exists
    let finalRedirect = appTarget;
    if (hash) {
      finalRedirect += (appTarget.includes('#') ? '&' : '#') + hash.substring(1);
    }

    // 4. Perform the jump
    window.location.replace(finalRedirect);
  </script>
</body>

</html>
