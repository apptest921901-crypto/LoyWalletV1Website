<!DOCTYPE html>
<html>

<head>
    <title>LoyWallet Auth Callback v1.1.3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: -apple-system, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #F8F9FB;
            color: #1A1A1A;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007AFF;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .content {
            text-align: center;
            padding: 20px;
        }

        .button {
            display: none;
            margin-top: 20px;
            padding: 12px 24px;
            background: #007AFF;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="content">
        <div id="status-icon" class="loader"></div>
        <h2 id="status-text">Finalizing login...</h2>
        <p id="sub-text">Redirecting you back to the LoyWallet app.</p>
        <a id="manual-link" class="button">Open LoyWallet</a>
    </div>

    <script>
        (function () {
            try {
                // 1. Capture tokens from the hash (#) and errors from the search (?)
                const hash = window.location.hash;
                const search = window.location.search;

                const appScheme = "loywalletv1://callback";
                
                if (!hash && !search) {
                    document.getElementById('status-icon').style.display = 'none';
                    document.getElementById('status-text').innerText = "Session expired or invalid";
                    document.getElementById('sub-text').innerText = "Please try logging in again from the app.";
                    return;
                }

                const targetUrl = appScheme + search + hash;

                window.location.href = targetUrl;
                
                setTimeout(() => { window.location.replace(targetUrl); }, 100);

                setTimeout(function () {
                    document.getElementById('status-icon').style.display = 'none';
                    document.getElementById('status-text').innerText = "Action Required";
                    document.getElementById('sub-text').innerHTML = "We're trying to open the LoyWallet app.<br><small>If you are using Expo Go, ensure your scheme is correct.</small>";
                    
                    const btn = document.getElementById('manual-link');
                    btn.style.display = 'inline-block';
                    btn.href = targetUrl;
                    btn.innerText = "Open LoyWallet App";
                }, 2000);
            } catch (err) {
                console.error("Redirect logic failed:", err);
                document.getElementById('status-text').innerText = "An error occurred during redirection.";
            }
        })();
    </script>
</body>

</html>
