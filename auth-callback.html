<!DOCTYPE html>
<html lang="fr">
<!-- LoyWallet Auth Callback v1.2.4 -->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentification | LoyWallet</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 3rem 1rem;
      background-color: #f4f7f9;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      max-width: 400px;
      width: 100%;
      background: #fff;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #0066ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 2rem auto;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .btn {
      display: inline-block;
      padding: 0.9rem 2rem;
      background: #0066ff;
      color: #fff;
      text-decoration: none;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo" style="font-size: 1.8rem; font-weight: 800; color: #0066ff; margin-bottom: 1.5rem;">LoyWallet
    </div>
    <div id="status-area">
      <h1>Connexion réussie !</h1>
      <p>Préparation de la redirection vers l'application...</p>
      <div class="spinner"></div>
      <button class="btn" onclick="redirectToApp()">Ouvrir l'application</button>
    </div>
  </div>

  <script>
    function getOAuthParams() {
      const hash = window.location.hash.substring(1);
      const search = window.location.search.substring(1);
      const params = new URLSearchParams(hash || search);
      return {
        accessToken: params.get('access_token'),
        refreshToken: params.get('refresh_token'),
        error: params.get('error') || params.get('error_description')
      };
    }

    function redirectToApp() {
      const { accessToken, refreshToken, error } = getOAuthParams();
      const statusEl = document.getElementById('status-area');

      if (error) {
        statusEl.innerHTML = `<h1 style="color:#cf1322">Erreur</h1><p>${decodeURIComponent(error.replace(/\+/g, ' '))}</p>`;
        return;
      }

      if (!accessToken) {
        statusEl.innerHTML = `<h1>Session expirée</h1><p>Aucun jeton trouvé. Veuillez relancer la connexion.</p>`;
        return;
      }

      // Target scheme matching AuthContext.tsx
      let targetBase = 'loywalletv1://callback';

      // Support for Local Dev environment
      if (location.hostname === 'localhost' || location.hostname.includes('192.168')) {
        targetBase = 'exp://192.168.1.14:8081/--/callback';
      }

      const finalDeepLink = `${targetBase}?access_token=${accessToken}&refresh_token=${refreshToken}`;

      // Primary redirection
      window.location.href = finalDeepLink;

      // Backup for browsers that block automatic URL scheme triggers
      setTimeout(() => {
        const link = document.createElement('a');
        link.href = finalDeepLink;
        link.click();
      }, 500);
    }

    if (getOAuthParams().accessToken) {
      setTimeout(redirectToApp, 300);
    }
  </script>
</body>

</html>
